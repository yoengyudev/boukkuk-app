<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification</title>
  <link rel="stylesheet" href="../../../assets/css/main.css" />
  <link rel="stylesheet" href="../../../vender/bootstrap-icon/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../../../assets/css/style.css" />
</head>

<body class="bg-primary">
  <section>
    <div class="container vh-100 d-flex align-items-center" style="max-width: 1100px;">
      <div style="border: 2px solid #fff; padding:10px; border-radius: 8px;">
        <div class="row align-items-center bg-white m-auto" style="border-radius: 8px; height:500px;">
          <div class="col-12 col-md-5 d-none d-md-block">
            <div class="d-flex justify-content-center align-items-center">
              <img src="../../../assets/image/autenication/verification-otp.svg" class="card-img" alt="">
            </div>
          </div>
          <div class="col-12 col-md-7">
            <div class="card bg-transparent border-0" style="border-radius: 8px">
              <div class="card-body p-md-4 p-xl-5">
                <div class="row">
                  <div class="col-12">
                    <div class="mb-4">
                      <h2 class="h3 mb-4 text-center text-dark-emphasis">បញ្ខូលកូដ OTP</h2>
                      <h3 class="fs-6 fw-normal text-dark-emphasis lh-base text-center m-0">
                        សូមពិនិត្យមើលក្នុងប្រអប់សារអុីម៉ែល កូដផ្ញើទៅកាន់
                        <span id="getEmail">name@gmail.com</span>
                      </h3>
                    </div>
                  </div>
                </div>
                <form id="otpForm">
                  <div class="row gy-3 overflow-hidden">
                    <div class="col-12">
                      <div class="mb-3 d-flex gap-2">
                        <input type="text" maxlength="1" autocomplete="off"
                          class="form-control py-2 py-md-3 text-center otp-input" />
                        <input type="text" maxlength="1" autocomplete="off"
                          class="form-control py-2 py-md-3 text-center otp-input" />
                        <input type="text" maxlength="1" autocomplete="off"
                          class="form-control py-2 py-md-3 text-center otp-input" />
                        <input type="text" maxlength="1" autocomplete="off"
                          class="form-control py-2 py-md-3 text-center otp-input" />
                        <input type="text" maxlength="1" autocomplete="off"
                          class="form-control py-2 py-md-3 text-center otp-input" />
                        <input type="text" maxlength="1" autocomplete="off"
                          class="form-control py-2 py-md-3 text-center otp-input" />
                      </div>
                    </div>
                    <p id="otpMessageBox" class="mt-n10"></p>
                    <div class="col-12 text-center mt-4">
                      <button type="button" id="resendOtpButton" class="btn text-primary">
                        <span class="spinner-border spinner-border-sm" id="spinner_resend" style="display:none;"
                          aria-hidden="true"></span>
                        <span id="buttonText1">ផ្ញើកូដម្ដងទៀត</span>
                      </button>
                    </div>
                    <div class="col-12">
                      <button id="otpVerifi" class="btn btn-primary w-100" type="submit">
                        <span class="spinner-border spinner-border-sm" id="spinner" style="display:none;"
                          aria-hidden="true"></span>
                        <span id="buttonText">កំណត់ពាក្យសម្ងាត់</span>
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="../../../assets/js/otp.js"></script>
</body>

</html>
