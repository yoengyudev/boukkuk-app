<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phnom Penh Laundry Shop Wishlist</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../assets/css/main.css" />
    <link rel="stylesheet" href="../../../assets/css/long.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <section class="wishList">
      <div class="container">
        <h1><i class="fas fa-tshirt me-3"></i>My Wishlist Items</h1>
        <div id="wishlist-items" class="row">
          <!-- Wishlist items will be dynamically added here -->
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const wishlistItems = [
        {
          id: 1,
          name: "T-Shirt",
          khmerName: "អាវយឺត",
          rating: 4.7,
          price: "$2/piece",
          serviceType: "Wash & Iron",
          shopName: "Modern Laundry",
          shopKhmerName: "ម៉ូឌឺនឡនដ្រី",
          image: "/assets/image/service-icon/shirt.png",
        },
        {
          id: 2,
          name: "Jeans",
          khmerName: "ខោខូវប៊យ",
          rating: 4.5,
          price: "$3/piece",
          serviceType: "Dry Clean",
          shopName: "Fresh & Clean",
          shopKhmerName: "ស្រស់និងស្អាត",
          image: "/assets/image/service-icon/pant.png",
        },
        {
          id: 3,
          name: "Dress",
          khmerName: "សម្លៀកបំពាក់",
          rating: 4.8,
          price: "$4/piece",
          serviceType: "Premium Wash",
          shopName: "Royal Laundry",
          shopKhmerName: "រ៉ូយ៉ាល់ឡនដ្រី",
          image: "/assets/image/service-icon/hoddie.png",
        },
        {
          id: 4,
          name: "Suit",
          khmerName: "សំពត់",
          rating: 4.3,
          price: "$5/piece",
          serviceType: "Dry Clean",
          shopName: "Luxury Care",
          shopKhmerName: "ថែទាំប្រណីត",
          image: "/assets/image/service-icon/capet.png",
        },
      ];

      function renderWishlist() {
        const wishlistContainer = document.getElementById("wishlist-items");
        wishlistContainer.innerHTML = "";

        wishlistItems.forEach((item) => {
          const itemElement = document.createElement("div");
          itemElement.className = "col-lg-3 col-md-4 col-sm-6 mb-4";
          itemElement.innerHTML = `
            <div class="wishlist-item h-100">
              <div class="heart-icon">
                <i class="fas fa-heart"></i>
              </div>
              <div class="shop-info mb-2">
                <h5 class="shop-name">${item.shopName}</h5>
              </div>
              <div class="clickable-area" onclick="window.location.href='store.html'" style="cursor: pointer;">
                <div class="service-image mb-3">
                  <img src="${item.image}" alt="${item.name}" class="img-fluid w-100">
                </div>
                <div class="service-details">
                  <h4 class="service-name">${item.name}</h4>
                  <div class="service-type mb-2">
                    <i class="fas fa-tag me-2"></i>${item.serviceType}
                  </div>
                  <div class="service-rating mb-2">
                    ${"★".repeat(Math.floor(item.rating))}${item.rating % 1 ? "½" : ""}
                    ${"☆".repeat(5 - Math.ceil(item.rating))}
                    <span class="rating-value">${item.rating}</span>
                  </div>
                  <div class="service-info mb-2">
                    <div><i class="fas fa-dollar-sign me-2"></i>${item.price}</div>
                  </div>
                </div>
              </div>
              <div class="service-actions mt-3">
                <button class="btn-remove w-100" onclick="removeItem(${item.id}); event.stopPropagation();">
                  <i class="fas fa-trash-alt me-2"></i>Remove
                </button>
              </div>
            </div>
          `;
          wishlistContainer.appendChild(itemElement);
        });
      }

      function removeItem(id) {
        const index = wishlistItems.findIndex((item) => item.id === id);
        if (index !== -1) {
          wishlistItems.splice(index, 1);
          renderWishlist();
        }
      }

      // Initial render
      renderWishlist();
    </script>
  </body>
</html>
