<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phnom Penh Laundry Shop Wishlist</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/long.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
        background-color: #f0f8ff;
        color: #333;
      }
      .container {
        background-color: #ffffff;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 40px;
        margin-top: 50px;
        margin-bottom: 50px;
      }
      h1 {
        color: #2c3e50;
        text-align: center;
        margin-bottom: 40px;
        font-weight: 700;
        font-size: 2.5rem;
      }
      .wishlist-item {
        border: none;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 30px;
        background-color: #fff;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }
      .wishlist-item:hover {
        transform: scale(1.02);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      }
      .wishlist-item img {
        max-width: 140px;
        height: 140px;
        border-radius: 10px;
        object-fit: cover;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .item-details {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .shop-name {
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 10px;
        font-size: 1.3rem;
      }
      .shop-rating {
        color: #f1c40f;
        font-size: 1.1rem;
        margin-bottom: 10px;
      }
      .shop-address {
        color: #7f8c8d;
        font-size: 0.95rem;
        margin-bottom: 8px;
      }
      .shop-hours {
        color: #27ae60;
        font-size: 0.95rem;
        font-weight: 500;
      }
      .btn-visit {
        background-color: #3498db;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border: 2px solid transparent;
        border-color: #2980b9;
        font-size: 1rem;
      }
      .btn-visit:hover {
        background-color: #2980b9;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
        border-color: #fff;
      }
      .btn-remove {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-right: 10px;
        border: 2px solid transparent;
        border-color: #c0392b;
        font-size: 1rem;
      }
      .btn-remove:hover {
        background-color: #c0392b;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(231, 76, 60, 0.3);
        border-color: #fff;
      }
      .khmer-name {
        font-size: 0.9rem;
        color: #34495e;
        font-style: italic;
        margin-bottom: 5px;
      }

      @media (max-width: 768px) {
        .wishlist-item {
          flex-direction: column; /* Stack items vertically */
          align-items: center; /* Center align items */
          text-align: center; /* Center text */
          padding: 20px; /* Add padding */
        }

        .wishlist-item img {
          max-width: 100%; /* Make image responsive */
          height: auto; /* Maintain aspect ratio */
          margin-bottom: 15px; /* Space below image */
        }

        .item-details {
          margin-bottom: 15px; /* Space below item details */
        }

        .btn-visit,
        .btn-remove {
          width: 100%; /* Full width buttons */
          margin: 5px 0; /* Space between buttons */
        }
      }

      @media (min-width: 768px) and (max-width: 1024px) {
        .wishlist-item {
          display: flex; /* Use flexbox for layout */
          flex-direction: row; /* Align items in a row */
          margin-bottom: 20px; /* Space between items */
          border: 1px solid #e0e0e0; /* Add a subtle border */
          border-radius: 10px; /* Rounded corners */
          padding: 15px; /* Padding inside the item */
          background-color: #fff; /* Background color */
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }

        .wishlist-item img {
          max-width: 120px; /* Set a max width for images */
          height: auto; /* Maintain aspect ratio */
          margin-right: 15px; /* Space between image and text */
        }

        .item-details {
          flex: 1;
          margin-left: 40px;
          text-align: left;
        }

        .shop-name {
          font-size: 1.5rem; /* Increase font size */
          font-weight: bold; /* Make the shop name bold */
          margin-bottom: 5px; /* Space below shop name */
        }

        .khmer-name {
          font-size: 1.2rem; /* Increase font size */
          font-weight: 500; /* Medium weight for Khmer name */
          margin-bottom: 5px; /* Space below Khmer name */
        }

        .shop-rating,
        .shop-address,
        .shop-hours {
          font-size: 1rem; /* Increase font size */
          line-height: 1.5; /* Improve line height for readability */
          margin-bottom: 5px; /* Space below each text element */
          color: #555; /* Darker color for better contrast */
        }

        .btn-visit,
        .btn-remove {
          width: auto; /* Set buttons to auto width */
          padding: 10px 15px; /* Add padding for better touch targets */
          margin: 5px; /* Space between buttons */
          font-weight: bold; /* Make button text bold */
        }
      }
      @media (min-width: 1024px) and (max-width: 1200px) {
        .item-details {
          flex: 1;
          margin-left: 25px;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1><i class="fas fa-tshirt me-3"></i>Boakuk's Wish List</h1>

      <div id="wishlist-items">
        <!-- Wishlist items will be dynamically added here -->
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const wishlistItems = [
        {
          id: 1,
          name: "Clean Pro Laundry",
          khmerName: "សម្អាតអ៊ុតដោយអ្នកជំនាញ",
          rating: 4.7,
          address: "St 310, Sangkat Boeung Keng Kang III, Phnom Penh",
          hours: "Open: 7AM - 9PM",
          image:
            "https://www.sunandmoongroup.com.kh/uploads/images/Gallery/Companies_Projects/COMMERCIAL-LAUNDRY/sun-and-moon-laundry.jpg",
        },
        {
          id: 2,
          name: "Sparkle Wash",
          khmerName: "បោកគក់ភ្លឺថ្លា",
          rating: 4.5,
          address: "St 63, Sangkat Tonle Bassac, Phnom Penh",
          hours: "Open: 6AM - 10PM",
          image:
            "https://i0.wp.com/www.movetocambodia.com/wp-content/uploads/modern-laundry-phnom-penh.jpg?resize=660%2C495&ssl=1",
        },
        {
          id: 3,
          name: "Royal Laundry Service",
          khmerName: "សេវាកម្មបោកគក់រាជវង្ស",
          rating: 4.8,
          address: "Preah Monivong Blvd, Sangkat Phsar Thmei II, Phnom Penh",
          hours: "Open 24/7",
          image:
            "https://camtrepreneurs.weebly.com/uploads/2/5/9/0/25909495/2380025_orig.jpg",
        },
        {
          id: 4,
          name: "Fresh & Fast Laundromat",
          khmerName: "ហាងបោកគក់ស្រស់និងលឿន",
          rating: 4.3,
          address: "St 271, Sangkat Tuol Tumpung II, Phnom Penh",
          hours: "Open: 8AM - 8PM",
          image:
            "https://i0.wp.com/kbcambodia.com/wp-content/uploads/2016/12/MODERN-LAUNDRY-2.jpg?fit=960%2C642&ssl=1",
        },
      ];

      function renderWishlist() {
        const wishlistContainer = document.getElementById("wishlist-items");
        wishlistContainer.innerHTML = "";

        wishlistItems.forEach((item) => {
          const itemElement = document.createElement("div");
          itemElement.className = "row wishlist-item align-items-center";
          itemElement.innerHTML = `
                    <div class="col-md-2">
                        <img src="${item.image}" alt="${
            item.name
          }" class="img-fluid">
                    </div>
                    <div class="col-md-6 item-details">
                        <div class="shop-name">${item.name}</div>
                        <div class="khmer-name">${item.khmerName}</div>
                        <div class="shop-rating">
                            ${"★".repeat(Math.floor(item.rating))}${
            item.rating % 1 ? "½" : ""
          }
                            ${"☆".repeat(5 - Math.ceil(item.rating))}
                            <span style="color: #7f8c8d; margin-left: 5px;">${
                              item.rating
                            }</span>
                        </div>
                        <div class="shop-address"><i class="fas fa-map-marker-alt me-2"></i>${
                          item.address
                        }</div>
                        <div class="shop-hours"><i class="far fa-clock me-2"></i>${
                          item.hours
                        }</div>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn-remove" onclick="removeItem(${
                          item.id
                        })"><i class="fas fa-trash-alt me-2"></i>Remove</button>
                        <a href="add_cart.html" class="btn-visit mt-lg-2 text-decoration-none "><i class="fas fa-cart-plus me-2"></i>Add to Cart</a>
                    </div>
                `;
          wishlistContainer.appendChild(itemElement);
        });
      }

      function removeItem(id) {
        const index = wishlistItems.findIndex((item) => item.id === id);
        if (index !== -1) {
          wishlistItems.splice(index, 1);
          renderWishlist();
        }
      }

      // Initial render
      renderWishlist();
    </script>
  </body>
</html>
