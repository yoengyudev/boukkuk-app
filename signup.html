<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើប្រាស់គណនី</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="vender/bootstrap-icon/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <section class="py-5 d-flex align-items-center" style="background-color:#eeeeee;">
        <div class="container">
            <div class="row bg-white bg-login overflow-hidden m-auto" style="width: 1100px; border-radius: 6px;">
                <div class="col-6 bg-primary">
                    <div class="d-flex flex-column justify-content-between h-100 pt-5">
                        <div class="px-5 py-3">
                            <h1 class="text-secondary lh-base">សូមធ្វើការបង្កើតគណនីរបស់អ្នក នៅទីនេះ!</h1>
                        </div>
                        <div>
                            <img src="assets/image/autenication/signup.png" class="card-img" alt="">
                        </div>
                    </div>
                </div>
                <div class="col-6 py-5 px-5">
                    <h3 class="text-primary fw-bold text-center">Boukuk</h3>
                    <hr style="color:#aaa;">
                    <form action="" class="mt-5">
                        <div class="mb-3">
                            <label for="name" class="form-label d-flex align-items-center gap-2">
                                <span class="fs-18 fw-bold text-dark-emphasis">នាមត្រកោល និង​នាមខ្លួន</span>
                            </label>
                            <div class="d-flex border form-input overflow-hidden">
                                <div class="bg-icon d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-circle fs-18 text-dark-emphasis"></i>
                                </div>
                                <input type="text" class="form-control fs-18 border-0 rounded-5 px-3" id="name" placeholder="នាមត្រកោល និង​នាមខ្លួន*">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label d-flex align-items-center gap-2">
                                <span class="fs-18 fw-bold text-dark-emphasis">អុីម៉ែល ឬ លេខទូរស័ព្ទ</span>
                            </label>
                            <div class="d-flex border form-input overflow-hidden">
                                <div class="bg-icon d-flex align-items-center justify-content-center">
                                    <i class="bi bi-envelope fs-18 text-dark"></i>
                                </div>
                                <input type="email" class="form-control fs-18 border-0 rounded-5 px-3" id="email" placeholder="អុីម៉ែល ឬ លេខទូរស័ព្ទ*">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="date-birth" class="form-label d-flex align-items-center gap-2">
                                <span class="fs-18 fw-bold text-dark-emphasis">ថ្ងៃខែឆ្នាំកំណើត</span>
                            </label>
                            <div class="d-flex border form-input overflow-hidden">
                                <div class="bg-icon d-flex align-items-center justify-content-center">
                                    <i class="bi bi-calendar fs-18 text-dark-emphasis"></i>
                                </div>
                                <input type="text" class="form-control fs-18 border-0 rounded-5 px-3" id="date-birth" placeholder="ថ្ងៃខែឆ្នាំកំណើត*">
                            </div>
                        </div>
                        <div class="mb-5">
                            <label for="pass" class="form-label d-flex align-items-center gap-2">
                                <span class="fs-18 fw-bold text-dark-emphasis">ពាក្យសម្ងាត់</span>
                            </label>
                            <div class="d-flex border form-input overflow-hidden">
                                <div class="bg-icon d-flex align-items-center justify-content-center">
                                    <i class="bi bi-lock fs-18 text-dark"></i>
                                </div>
                                <input type="password" class="form-control fs-18 border-0 rounded-5 px-3" id="pass" placeholder="បញ្ចូលពាក្យសម្ងាត់*">
                            </div>
                        </div>
                        <div class="mb-5">
                            <button type="button" class="btn btn-primary w-100 fs-18">បង្កើតគណនី</button>
                        </div>
                        <hr style="color:#aaa;">
                        <div class="text-center">
                            <span>មានគណនីរួចហើយ?</span>
                            <a href="login.html">ចូលប្រើប្រាស់គណនី</a>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
