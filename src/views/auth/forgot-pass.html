<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="../../../assets/css/main.css" />
  <link rel="stylesheet" href="../../../vender/bootstrap-icon/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../../../assets/css/style.css" />
</head>

<body class="bg-primary">
  <section>
    <div class="container vh-100 d-flex align-items-center" style="width: 1100px;">
      <div style="border: 2px solid #fff; padding:10px; border-radius: 8px;">
        <div class="row align-items-center bg-white m-auto" style="border-radius: 8px; height:500px;">
          <div class="col-12 col-md-6">
            <div class="d-flex justify-content-center align-items-center">
              <img src="../../../assets/image/autenication/forgot-pass.jpg" style="width: 470px;" class="card-img" alt="">
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="card bg-transparent border-0" style="border-radius: 8px">
              <div class="card-body p-3 p-md-4 p-xl-5">
                <div class="row">
                  <div class="col-12">
                    <div class="mb-4">
                      <h2 class="h3 mb-4 text-dark-emphasis">
                        កំណត់ពាក្យសម្ងាត់ឡើងវិញ
                      </h2>
                      <h3 class="fs-6 fw-normal text-dark-emphasis lh-base m-0">
                        ផ្តល់អាសយដ្ឋានអ៊ីមែលដែលភ្ជាប់ជាមួយគណនីរបស់អ្នក
                        ដើម្បីប្ដូរពាក្យសម្ងាត់របស់អ្នក។
                      </h3>
                    </div>
                  </div>
                </div>
                <form action="#">
                  <div class="row gy-3 overflow-hidden">
                    <div class="col-12">
                      <div class="form-floating mb-3">
                        <input type="email" autocomplete="off" class="form-control" id="email"
                          placeholder="New Password" />
                        <label for="email">អុីម៉ែល</label>
                      </div>
                    </div>
                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit">
                        កំណត់ពាក្យសម្ងាត់
                      </button>
                    </div>
                    <div class="col-12 text-center mt-4">
                      <a href="login.html" class="text-primary text-decoration-none">
                        ត្រឡប់ក្រោយ
                      </a>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
