<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើប្រាស់គណនី</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="vender/bootstrap-icon/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <section class="vh-100 d-flex align-items-center" style="background-color:#eeeeee;">
        <div class="container">
            <div class="row bg-white bg-login overflow-hidden m-auto" style="width: 1100px; border-radius: 6px;">
                <div class="col-6 p-0">
                    <div class="login-img">
                        <img src="assets/image/autenication/login.svg" class="card-img" alt="">
                    </div>
                </div>
                <div class="col-6 py-5 px-5">
                    <h3 class="text-primary fw-bold text-center">Boukuk</h3>
                    <hr style="color:#aaa;">
                    <form action="" class="mt-5">
                        <div class="mb-3">
                            <label for="email" class="form-label d-flex align-items-center gap-2">
                                <span class="fs-18 text-dark-emphasis fw-bold">អុីម៉ែល ឬ លេខទូរស័ព្ទ</span>
                            </label>
                            <input type="email" class="form-control" id="email" placeholder="អុីម៉ែល ឬ លេខទូរស័ព្ទ*">
                        </div>
                        <div class="mb-5">
                            <label for="pass" class="form-label d-flex align-items-center gap-2">
                                <span class="fs-18 text-dark-emphasis fw-bold">ពាក្យសម្ងាត់</span>
                            </label>
                            <input type="password" class="form-control" id="pass" placeholder="បញ្ចូលពាក្យសម្ងាត់*">
                        </div>
                        <div class="mb-3">
                            <button type="button" class="btn btn-primary w-100 fs-18">ចូលប្រើប្រាស់គណនី</button>
                        </div>
                        <div class="d-flex justify-content-end mb-4">
                            <a href="forgot_pass_email.html" class="fs-18 text-decoration-none">ភ្លេចពាក្យសម្ងាត់?</a>
                        </div>
                        <hr style="color:#aaa;">
                        <div class="text-center">
                            <span>តើអ្នកជាសមាជិកថ្មី?</span>
                            <a href="signup.html">បង្កើតគណនី</a>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
