<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Form - Improved</title>
    <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/long.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="container my-5">
      <div
        class="glass-card m-auto col-12 col-md-10 row g-0 align-items-center"
      >
        <div class="col-lg-6 position-relative d-none d-lg-block">
          <div class="laundry-img">
            <img
              src="https://media.canva.com/v2/image-resize/format:PNG/height:454/quality:100/uri:s3%3A%2F%2Fmedia-private.canva.com%2FqnB9A%2FMAGRF6qnB9A%2F1%2Fp.png/watermark:F/width:454?csig=AAAAAAAAAAAAAAAAAAAAAD4GPTy35y7GJfwg3D9z5oRbtQ-JGCDLONcR5VB-Pft1&exp=1728994518&osig=AAAAAAAAAAAAAAAAAAAAAOT3ZyrQp2eouXiuQYHTTTjKDX1SuZkW07kPsrcFZ5Cx&signer=media-rpc&x-canva-quality=screen"
              alt="Laundry Illustration"
              class="img-fluid"
            />
          </div>
          <div class="baket position-absolute" style="left: 0%; bottom: -2%">
            <img
              src="https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:s3%3A%2F%2Fmedia-private.canva.com%2F0MUBE%2FMAGRF30MUBE%2F1%2Fp.png/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAH2uCGMC8VmO_I-4gW6Blq5DSjc1eUAQk2j7j5pRZcrk&exp=1728994316&osig=AAAAAAAAAAAAAAAAAAAAAKsqbwPwEWV_HCdCEAZ6tMtzY0LlAFrOVDSAcBoQNy1M&signer=media-rpc&x-canva-quality=thumbnail"
              alt="Laundry Basket"
              class="img-fluid"
            />
          </div>
          <div class="baket position-absolute" style="left: 25%; bottom: -5%">
            <img
              src="https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:s3%3A%2F%2Fmedia-private.canva.com%2FNa4bA%2FMAGRFwNa4bA%2F1%2Fp.png/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANnJfUyBkZCt3qzXmCW4uzL8hkfmvSW6Kr6soYjEgl8s&exp=1728995971&osig=AAAAAAAAAAAAAAAAAAAAAFLKXvF1ocoWO3Y6p-Rs-dnH3f_Xh4Ms3eoKLN3DUZzw&signer=media-rpc&x-canva-quality=thumbnail"
              alt="Another Laundry Basket"
              class="img-fluid"
            />
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="content">
            <h2 class="mb-2">Create</h2>
            <h1 class="mb-4">New Password</h1>
            <form>
              <div class="form-floating mb-4 position-relative">
                <input
                  type="password"
                  class="form-control"
                  id="floatingPassword"
                  placeholder="New Password"
                />
                <label for="floatingPassword">New Password</label>
                <span
                  class="password-toggle"
                  onclick="togglePassword('floatingPassword', 'toggleIcon1')"
                >
                  <i id="toggleIcon1" data-lucide="eye"></i>
                </span>
              </div>
              <div class="form-floating mb-4 position-relative">
                <input
                  type="password"
                  class="form-control"
                  id="floatingPassword1"
                  placeholder="Confirm Password"
                />
                <label for="floatingPassword1">Confirm Password</label>
                <span
                  class="password-toggle"
                  onclick="togglePassword('floatingPassword1', 'toggleIcon2')"
                >
                  <i id="toggleIcon2" data-lucide="eye"></i>
                </span>
              </div>
              <div
                class="d-flex flex-column flex-sm-row align-items-center justify-content-between"
              >
                <button type="submit" class="btn btn-primary mb-3 mb-sm-0">
                  Confirm
                </button>
                <div class="re-pass-link">
                  <a href="#">Back to Login</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      lucide.createIcons();
      function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {
          input.type = "text";
          icon.setAttribute("data-lucide", "eye-off");
        } else {
          input.type = "password";
          icon.setAttribute("data-lucide", "eye");
        }
        lucide.createIcons();
      }
    </script>
  </body>
</html>
