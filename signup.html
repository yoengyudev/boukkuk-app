<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="vender/aos/css/aos.css">
    <link rel="stylesheet" href="vender/fontawesome/css/all.css">
    <style>
    body {
        background-color: #3b5998;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
    }
    .container {
        background-color: #3b5998;
        border-radius: 10px;
        overflow: hidden;
        max-width: 1200px;
    }
    .signup-form {
        padding: 2rem;
    }
    .form-control {
        background-color: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
    }
    .form-control:focus {
        box-shadow: none;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background-color: rgba(255, 255, 255, 0.2);
    }
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }
    label {
        color: rgba(255, 255, 255, 0.9);
    }
    .btn-primary {
        background-color: #4267B2;
        border: none;
    }
    .btn-outline-light {
        border-color: rgba(255, 255, 255, 0.5);
    }
    .hover-text {
        text-decoration: none;
    }
    .hover-text:hover {
        text-decoration: underline;
    }
    .image-container {
      width: 100%;
      height: 100%;  
     
    }
    .image-container img{
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 10px;
       
  }    
    .bg__form{
        background-color: rgb(33, 33, 33);
        border-radius: 10px;
    }
    @media (max-width: 767.98px) {
        .image-container {
            min-height: 200px;
            
        }

        .image-container img{
            padding: 50px;
        }

    }
    </style>
</head>
<body>
    <div class="container">
      <div class="bg__form">
        <div class="row">
            <div class="col-md-6 p-0">
                <div class="image-container">
                    <img src="https://wedolaundry.ca/6c20a9c05aeb1ae49adab5a0f45da0b7.svg" alt="">
                </div>
            </div>
            <div class="col-md-6">
                <div class="signup-form text-white">
                    <h2 class="text-center mb-4">
                        👋 Create Account
                    </h2>
                    <form>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Sign Up</button>
                        <div class="text-center mb-3">Or sign up with</div>
                        <button type="button" class="btn btn-outline-light w-100 mb-2">
                            <img src="https://img.icons8.com/color/16/000000/google-logo.png" alt="Google icon" class="me-2">
                            Sign up with Google
                        </button>
                        <button type="button" class="btn btn-outline-light w-100 mb-3">
                            <img src="https://img.icons8.com/color/16/000000/facebook-new.png" alt="Facebook icon" class="me-2">
                            Sign up with Facebook
                        </button>
                        <div class="text-center">
                            Already have an account? <a href="#" class="text-white hover-text">Sign In</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
      </div>
    </div>
    <script src="vender/aos/js/aos.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
