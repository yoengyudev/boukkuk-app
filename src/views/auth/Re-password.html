<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ទម្រង់កំណត់ពាក្យសម្ងាត់ឡើងវិញ</title>
  <link rel="stylesheet" href="../../../assets/css/main.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../../assets/css/long.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-primary re-pass-body">
  <div class="container my-5">
    <div class="outer m-auto col-12 col-md-10">
      <div class="glass-card bg-white w-100 row g-0 align-items-center outline-card">
        <div class="col-lg-6 position-relative d-none d-lg-block">
          <div class="laundry-img">
            <img src="../../../assets/image/autenication/re-pass.png" alt="រូបភាពក្រាហ្វិក" class="img-fluid" />
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="content">
            <h2 class="mb-2 text-black">បង្កើត</h2>
            <h1 class="mb-4 text-dark">ពាក្យសម្ងាត់ថ្មី</h1>
            <form id="resetForm">
              <div class="form-floating mb-4 position-relative">
                <input type="password" class="form-control" id="Password1" placeholder="ពាក្យសម្ងាត់ថ្មី" />
                <label for="Password1">ពាក្យសម្ងាត់ថ្មី</label>
                <span class="password-toggle" onclick="togglePassword('Password1', 'toggleIcon1')">
                  <i id="toggleIcon1" data-lucide="eye"></i>
                </span>
              </div>
              <div class="form-floating mb-4 position-relative">
                <input type="password" class="form-control" id="Password2" placeholder="បញ្ជាក់ពាក្យសម្ងាត់" />
                <label for="Password2">បញ្ជាក់ពាក្យសម្ងាត់</label>
                <span class="password-toggle" onclick="togglePassword('Password2', 'toggleIcon2')">
                  <i id="toggleIcon2" data-lucide="eye"></i>
                </span>
              </div>
              <div class="d-flex flex-column flex-sm-row align-items-center justify-content-between">
                <a href="login.html" type="submit" class="re-btn btn btn-primary mb-3 mb-sm-0">
                  បញ្ជាក់
                </a>
                <div class="re-pass-link">
                  <a class="btn btn-link" href="login.html">ត្រឡប់ទៅការចូល</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../../vender/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    lucide.createIcons();
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      if (input.type === "password") {
        input.type = "text";
        icon.setAttribute("data-lucide", "eye-off");
      } else {
        input.type = "password";
        icon.setAttribute("data-lucide", "eye");
      }
      lucide.createIcons();
    }

    document
      .getElementById("resetForm")
      .addEventListener("submit", function (e) {
        e.preventDefault();
        reset_pass();
      });

    function reset_pass() {
      let Re_Pass = "https://mps10.chandalen.dev/api/reset/pass";
      let pass1 = document.getElementById("Password1").value;
      let pass2 = document.getElementById("Password2").value;
      let formData = new FormData();
      formData.append("Password", pass1);
      formData.append("Password", pass2);

      // Show loading overlay
      document.getElementById("loadingOverlay").style.display = "flex";

      // Set the start time
      const startTime = Date.now();

      fetch(Re_Pass, {
        method: "POST",
        headers: {
          Accept: "application/json",
        },
        body: formData,
      })
        .then((res) => res.json())
        .then((json) => {
          console.log(json);
          hideLoadingOverlay(startTime);
        })
        .catch((error) => {
          console.error("Error:", error);
          hideLoadingOverlay(startTime);
        });
    }
  </script>
</body>

</html>
