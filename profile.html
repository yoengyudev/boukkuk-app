<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Settings - Laundry Service App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

      :root {
        --primary: #f28b82;
        --secondary: #ffcdd2;
        --success: #66bb6a;
        --info: #64b5f6;
        --warning: #ffb74d;
        --danger: #e57373;
        --light: #fce4ec;
        --dark: #424242;
        --background: #fff5f5;
        --text: #424242;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--background);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
      }

      .card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(242, 139, 130, 0.1);
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(242, 139, 130, 0.2);
      }

      .nav-pills .nav-link {
        color: var(--text);
        border-radius: 30px;
        padding: 10px 20px;
        margin: 5px;
        transition: all 0.3s ease;
      }

      .nav-pills .nav-link.active {
        background-color: var(--primary);
        color: white;
        box-shadow: 0 5px 15px rgba(242, 139, 130, 0.4);
      }

      /* .btn-custom {
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 30px;
        padding: 10px 25px;
        transition: all 0.3s ease;
      }

      .btn-custom:hover {
        background-color: #e57373;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(242, 139, 130, 0.4);
      } */

      .form-control,
      .form-select {
        border-radius: 15px;
        border: 2px solid var(--secondary);
        padding: 12px 20px;
        transition: all 0.3s ease;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(242, 139, 130, 0.1);
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid white;
        box-shadow: 0 5px 15px rgba(242, 139, 130, 0.2);
      }

      .order-item,
      .notification-item {
        background-color: #f3f3f3;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 15px;
        transition: all 0.3s ease;
      }

      .order-item:hover,
      .notification-item:hover {
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(242, 139, 130, 0.1);
      }

      .badge-custom {
        padding: 8px 15px;
        border-radius: 20px;
        font-weight: 600;
      }

      .section-title {
        color: var(--primary);
        font-weight: 600;
        margin-bottom: 1.5rem;
      }

      .gradient-text {
        background: linear-gradient(45deg, var(--primary), var(--danger));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h1 class="text-center mb-5 fw-bold gradient-text">Profile Settings</h1>

      <ul
        class="nav nav-pills mb-4 justify-content-center"
        id="profileTabs"
        role="tablist"
      >
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="personal-tab"
            data-bs-toggle="pill"
            data-bs-target="#personal"
            type="button"
            role="tab"
            aria-controls="personal"
            aria-selected="true"
          >
            <i class="bi bi-person-fill me-2"></i>Personal
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="orders-tab"
            data-bs-toggle="pill"
            data-bs-target="#orders"
            type="button"
            role="tab"
            aria-controls="orders"
            aria-selected="false"
          >
            <i class="bi bi-clock-history me-2"></i>Orders
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="notifications-tab"
            data-bs-toggle="pill"
            data-bs-target="#notifications"
            type="button"
            role="tab"
            aria-controls="notifications"
            aria-selected="false"
          >
            <i class="bi bi-bell-fill me-2"></i>Notifications
          </button>
        </li>
        
      </ul>

      <div class="tab-content" id="profileTabsContent">
        <div
          class="tab-pane fade show active"
          id="personal"
          role="tabpanel"
          aria-labelledby="personal-tab"
        >
          <div class="card mb-4">
            <div class="card-body">
              <h2 class="section-title">Personal Information</h2>
              <div class="text-center mb-4">
                <img
                  src="assets/img/AboutUs-review2.avif"
                  alt="Profile Picture"
                  class="avatar mb-3"
                  id="profileImage"
                />
                <input
                  type="file"
                  id="imageUpload"
                  accept="image/*"
                  class="d-none"
                />
                <button
                  class="btn btn-custom btn-primary"
                  id="changePictureBtn"
                >
                  Change Picture
                </button>
              </div>
              <form>
                <div class="row g-4 mb-3">
                  <div class="col-md-6">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="fullName"
                      placeholder="John Doe"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="john@example.com"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input
                      type="tel"
                      class="form-control"
                      id="phone"
                      placeholder="+1 (555) 123-4567"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="address" class="form-label">Address</label>
                    <input
                      type="text"
                      class="form-control"
                      id="address"
                      placeholder="123 Main St, Anytown, ST 12345"
                    />
                  </div>
                </div>
                <button type="submit" class="btn btn-custom btn-primary">
                  Save Changes
                </button>
              </form>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <h2 class="section-title">Payment Methods</h2>
              <div class="payment-list" id="paymentList">
                <!-- Added container for payment methods -->
                <!-- Existing payment items will be dynamically inserted here -->
              </div>
              <form id="addPaymentForm" class="mb-3">
                <!-- Added form for adding new payment -->
                <div class="mb-3">
                  <label for="cardHolder" class="form-label"
                    >Cardholder Name</label
                  >
                  <input
                    type="text"
                    id="cardHolder"
                    class="form-control"
                    placeholder="John Doe"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="cardNumber" class="form-label">Card Number</label>
                  <input
                    type="text"
                    id="cardNumber"
                    class="form-control"
                    placeholder="1234 5678 9012 3456"
                    required
                    maxlength="19"
                  />
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="expiryDate" class="form-label"
                      >Expiration Date</label
                    >
                    <input
                      type="text"
                      id="expiryDate"
                      class="form-control"
                      placeholder="MM/YY"
                      required
                      maxlength="5"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="cvv" class="form-label">CVV</label>
                    <input
                      type="text"
                      id="cvv"
                      class="form-control"
                      placeholder="123"
                      required
                      maxlength="3"
                    />
                  </div>
                </div>
                <button
                  type="submit"
                  class="btn btn-custom btn-primary w-100 mt-2"
                >
                  Add New Payment Method
                </button>
              </form>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <h2 class="section-title">Security</h2>
              <button
                class="btn btn-custom btn-primary w-100 mb-3"
                id="changePasswordBtn"
              >
                <i class="bi bi-lock-fill me-2"></i>Change Password
              </button>
              <div class="form-check form-switch mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="twoFactorAuth"
                />
                <label class="form-check-label" for="twoFactorAuth"
                  >Enable Two-Factor Authentication</label
                >
              </div>
              <div id="twoFactorSetup" class="d-none">
                <div class="alert alert-info mb-3" role="alert">
                  <strong>Setup Instructions:</strong> Scan the QR code below
                  with your authenticator app (e.g., Google Authenticator).
                </div>
                <div class="text-center mb-3">
                  <img
                    id="qrCode"
                    src=""
                    alt="QR Code"
                    class="img-fluid mb-3"
                    style="max-width: 200px"
                  />
                </div>
                <div class="mb-3">
                  <label for="secretCode" class="form-label"
                    >Or enter the code:</label
                  >
                  <input
                    type="text"
                    id="secretCode"
                    class="form-control"
                    placeholder="Enter your code"
                  />
                </div>
                <button class="btn btn-custom w-100 btn-primary" id="verify2faBtn">
                  Verify 2FA
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          class="tab-pane fade"
          id="orders"
          role="tabpanel"
          aria-labelledby="orders-tab"
        >
          <div class="card">
            <div class="card-body">
              <h2 class="section-title">Order History</h2>
              <div
                class="order-list"
                style="max-height: 500px; padding-right: 12px; overflow-y: auto"
              >
                <!-- Order items will be dynamically inserted here -->
              </div>
            </div>
          </div>
        </div>

        <div
          class="tab-pane fade"
          id="notifications"
          role="tabpanel"
          aria-labelledby="notifications-tab"
        >
          <div class="card">
            <div class="card-body">
              <h2 class="section-title">Notification Preferences</h2>
              <div class="form-check form-switch mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="pushNotifications"
                  checked
                />
                <label class="form-check-label" for="pushNotifications"
                  >Push Notifications</label
                >
              </div>
              <div class="form-check form-switch mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="emailNotifications"
                />
                <label class="form-check-label" for="emailNotifications"
                  >Email Notifications</label
                >
              </div>
              <h3 class="mb-3">Recent Notifications</h3>
              <div
                class="notification-list"
                style="max-height: 400px; padding-right: 12px; overflow-y: auto"
              >
                <!-- Notification items will be dynamically inserted here -->
              </div>
            </div>
          </div>
        </div>

     
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Generate mock order history
        const orderList = document.querySelector(".order-list");
        for (let i = 0; i < 10; i++) {
          const orderItem = document.createElement("div");
          orderItem.className = "order-item";
          orderItem.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong>Order #${1000 + i}</strong>
                        <span class="badge badge-custom ${
                          i % 2 === 0 ? "bg-success" : "bg-warning"
                        }">${i % 2 === 0 ? "Completed" : "In Progress"}</span>
                    </div>
                    <p class="mb-1">Date: ${new Date().toLocaleDateString()}</p>
                    <p class="mb-1">Total: $${(Math.random() * 50 + 10).toFixed(
                      2
                    )}</p>
                    <div class="d-flex align-items-center">
                        <i class="bi bi-box me-2"></i>
                        <span>${Math.floor(Math.random() * 5 + 1)} items</span>
                    </div>
                `;
          orderList.appendChild(orderItem);
        }

        // Generate mock notifications
        const notificationList = document.querySelector(".notification-list");
        for (let i = 0; i < 5; i++) {
          const notificationItem = document.createElement("div");

          notificationItem.className = "notification-item";
          notificationItem.innerHTML = `
                    <p class="mb-1"><strong>Your laundry is ready for pickup!</strong></p>
                    <p class="text-muted mb-0">${new Date().toLocaleString()}</p>
                `;
          notificationList.appendChild(notificationItem);
        }

        // Handle image upload
        const imageUpload = document.getElementById("imageUpload");
        const profileImage = document.getElementById("profileImage");
        const changePictureBtn = document.getElementById("changePictureBtn");

        changePictureBtn.addEventListener("click", function () {
          imageUpload.click(); // Trigger file input click
        });

        imageUpload.addEventListener("change", function () {
          const file = this.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              profileImage.src = e.target.result; // Update image source
            };
            reader.readAsDataURL(file); // Read the file as a data URL
          }
        });

        // Format card number input
        const cardNumberInput = document.getElementById("cardNumber");
        cardNumberInput.addEventListener("input", function () {
          // Remove all non-digit characters
          let value = this.value.replace(/\D/g, "");
          // Format the card number with spaces
          this.value = value.replace(/(.{4})/g, "$1 ").trim();
        });

        // Format expiration date input
        const expiryDateInput = document.getElementById("expiryDate");
        expiryDateInput.addEventListener("input", function () {
          // Remove all non-digit characters
          let value = this.value.replace(/\D/g, "");
          // Format the expiration date with a slash
          if (value.length > 2) {
            this.value = value.slice(0, 2) + "/" + value.slice(2, 4);
          } else {
            this.value = value;
          }
        });

        // Handle adding new payment method
        const addPaymentForm = document.getElementById("addPaymentForm");
        const paymentList = document.getElementById("paymentList");

        addPaymentForm.addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent form submission

          // Get card details
          const cardHolder = document.getElementById("cardHolder").value;
          const cardNumber = document.getElementById("cardNumber").value;
          const expiryDate = document.getElementById("expiryDate").value;
          const cvv = document.getElementById("cvv").value;

          if (cardHolder && cardNumber && expiryDate && cvv) {
            const paymentItem = document.createElement("div");
            paymentItem.className =
              "d-flex justify-content-between align-items-center mb-3 p-3 bg-light rounded";
            paymentItem.innerHTML = `
              <div>
                <i class="bi bi-credit-card me-2"></i>
                <span>${cardHolder} - ${cardNumber} (Exp: ${expiryDate})</span>
              </div>
              <button class="btn btn-outline-danger btn-sm rounded-pill remove-card">Remove</button>
            `;
            paymentList.appendChild(paymentItem); // Add new payment method to the list
            addPaymentForm.reset(); // Clear input fields
          }
        });

        // Handle removing payment method
        paymentList.addEventListener("click", function (event) {
          if (event.target.classList.contains("remove-card")) {
            const paymentItem = event.target.closest("div"); // Get the payment item
            paymentList.removeChild(paymentItem); // Remove the payment item
          }
        });

        // Handle Two-Factor Authentication toggle
        const twoFactorAuthCheckbox = document.getElementById("twoFactorAuth");
        const twoFactorSetup = document.getElementById("twoFactorSetup");
        const qrCode = document.getElementById("qrCode");
        const secretCodeInput = document.getElementById("secretCode");

        twoFactorAuthCheckbox.addEventListener("change", function () {
          if (this.checked) {
            // Simulate generating a secret code and QR code
            const generatedSecret = "JBSWY3DPEHPK3PXP"; // Example secret code
            secretCodeInput.value = generatedSecret; // Display the secret code
            qrCode.src = `https://api.qrserver.com/v1/create-qr-code/?data=otpauth://totp/MyApp:${encodeURIComponent(
              "user@example.com"
            )}?secret=${generatedSecret}&issuer=MyApp`; // Generate QR code
            twoFactorSetup.classList.remove("d-none"); // Show setup instructions
          } else {
            twoFactorSetup.classList.add("d-none"); // Hide setup instructions
            secretCodeInput.value = ""; // Clear the secret code input
            qrCode.src = ""; // Clear the QR code
          }
        });

        // Handle 2FA verification (this is a placeholder for actual verification logic)
        const verify2faBtn = document.getElementById("verify2faBtn");
        verify2faBtn.addEventListener("click", function () {
          alert("2FA verification logic goes here."); // Placeholder for verification logic
        });
      });
    </script>
  </body>
</html>
