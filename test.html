<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងបោកអ៊ុត - Book Services</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/vender/bootstrap-icon/font/bootstrap-icons.css">
    <style>
        .service-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .service-card:hover {
            border-color: #4263EB;
            background: #f8f9ff;
        }

        .service-card.selected {
            border-color: #4263EB;
            background: #f0f3ff;
        }

        .service-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4263EB;
            border-radius: 8px;
            color: white;
        }

        .service-name {
            font-size: 16px;
            color: #333;
            margin: 0;
        }

        .continue-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background: #4263EB;
            color: white;
            font-weight: 500;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .continue-btn.enabled {
            opacity: 1;
            cursor: pointer;
        }

        .services-container {
            max-width: 400px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 500;
            margin: 20px 0;
            padding: 0 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-button {
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 20px 0;
            padding: 0 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <a href="#" class="back-button">
        <i class="bi bi-arrow-left"></i>
        Back
    </a>
    
    <h1 class="page-title">Book Services</h1>

    <div class="services-container">
        <div class="service-card" data-service="washing">
            <div class="service-icon">
                <i class="bi bi-water"></i>
            </div>
            <span class="service-name">Washing</span>
        </div>

        <div class="service-card" data-service="iron">
            <div class="service-icon">
                <i class="bi bi-lightning"></i>
            </div>
            <span class="service-name">Iron</span>
        </div>

        <div class="service-card" data-service="dry-clean">
            <div class="service-icon">
                <i class="bi bi-droplet"></i>
            </div>
            <span class="service-name">Dry Clean</span>
        </div>

        <div class="service-card" data-service="carpet-clean">
            <div class="service-icon">
                <i class="bi bi-rainbow"></i>
            </div>
            <span class="service-name">Carpet Cl.</span>
        </div>

        <div class="service-card" data-service="shoe-clean">
            <div class="service-icon">
                <i class="bi bi-boot"></i>
            </div>
            <span class="service-name">Shoe Clean</span>
        </div>

        <div class="service-card" data-service="bed-sheet">
            <div class="service-icon">
                <i class="bi bi-house"></i>
            </div>
            <span class="service-name">Bed Sheet</span>
        </div>

        <div class="service-card" data-service="wash-iron">
            <div class="service-icon">
                <i class="bi bi-stars"></i>
            </div>
            <span class="service-name">Wash + Iron</span>
        </div>
    </div>

    <button class="continue-btn" id="continueBtn" disabled>Continue</button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const serviceCards = document.querySelectorAll('.service-card');
            const continueBtn = document.getElementById('continueBtn');
            let selectedServices = new Set();

            serviceCards.forEach(card => {
                card.addEventListener('click', function() {
                    const service = this.dataset.service;
                    
                    if (this.classList.contains('selected')) {
                        this.classList.remove('selected');
                        selectedServices.delete(service);
                    } else {
                        this.classList.add('selected');
                        selectedServices.add(service);
                    }

                    // Enable/disable continue button based on selections
                    if (selectedServices.size > 0) {
                        continueBtn.classList.add('enabled');
                        continueBtn.disabled = false;
                    } else {
                        continueBtn.classList.remove('enabled');
                        continueBtn.disabled = true;
                    }
                });
            });

            continueBtn.addEventListener('click', function() {
                if (selectedServices.size > 0) {
                    // Handle the continue action here
                    console.log('Selected services:', Array.from(selectedServices));
                    // You can redirect to the next page or handle the selection as needed
                }
            });
        });
    </script>
</body>

</html>
