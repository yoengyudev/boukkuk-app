<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ចូលប្រើប្រាស់គណនី</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link
      rel="stylesheet"
      href="/vender/bootstrap-icon/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/assets/css/long.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>

  <body style="background: linear-gradient(to bottom, #4762e6, #7680f0)">
    <section class="vh-100 d-flex align-items-center">
      <div class="container">
        <div class="outer col-12 col-md-10 m-auto">
          <div
            class="row bg-white mx-auto w-100 bg-login overflow-hidden"
            style="width: 1100px; border-radius: 20px"
          >
            <div class="col-6 d-none d-lg-block p-0">
              <div class="login-img">
                <img
                  src="/assets/image/autenication/Forgot password-bro.png"
                  class="card-img"
                  alt=""
                />
              </div>
            </div>
            <div class="col-12 col-lg-6 p-4 py-lg-5 px-lg-5">
              <h3 class="text-primary fw-bold text-center text-lg-start fs-1">
                សូមស្វាគមន៏!
              </h3>
              <form id="login" class="mt-4">
                <div class="form-floating mb-4 position-relative">
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="New Password"
                  />
                  <label for="email">អុីម៉ែល</label>
                </div>
                <div class="form-floating mb-4 position-relative">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="New Password"
                    aria-describedby="togglePassword"
                  />
                  <label for="pass">ពាក្យសម្ងាត់</label>
                  <span
                    class="password-toggle"
                    onclick="togglePassword('password', 'toggleIcon1')"
                  >
                    <i id="toggleIcon1" class="fas fa-eye"></i>
                  </span>
                </div>
                <div class="mb-4">
                  <button type="submit" class="btn btn-primary w-100 fs-18">
                    ចូលប្រើប្រាស់គណនី
                  </button>
                </div>
                <div class="d-flex justify-content-end mb-4">
                  <a href="forgot-pass.html" class="fs-18 text-decoration-none"
                    >ភ្លេចពាក្យសម្ងាត់?</a
                  >
                </div>
                <hr style="color: #aaa" />
                <div class="text-center mt-4">
                  <span>តើអ្នកជាសមាជិកថ្មី?</span>
                  <a href="signup.html">បង្កើតគណនី</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="../../../assets/js/script.js"></script>
    <script src="../../../assets/js/login.js"></script>
  </body>
</html>
