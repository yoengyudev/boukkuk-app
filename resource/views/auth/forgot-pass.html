<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/vender/bootstrap-icon/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body style="background: linear-gradient(to bottom, #4762E6, #7680f0);">
    <section class="vh-100">
        <div class="container">
            <div class="row align-items-center vh-100">
                <div class="col-12 col-md-6 col-xl-7">
                    <div class="d-flex justify-content-center">
                        <div class="col-12 col-xl-9">
                            <h3 class="text-white fw-bold">Boukuk</h3>
                            <hr class="border-primary-subtle mb-4">
                            <h2 class="fs-1 lh-base mb-4 text-white">ការ​ផ្លាស់ប្ដូរពាក្យសម្ងាត់​គណនី</h2>
                            <p class="lead mb-5 text-white">
                                យើងផ្តល់ជូនសេវាបោកគក់គ្រប់ប្រភេទ និង​ដឹកជញ្ជូនគ្រប់ទីកន្លែង ដោយធានាបាននូវភាពងាយស្រួល​ និងគុណភាពដល់អ្នកប្រើប្រាស់។
                            </p>
                            <div class="text-endx">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#ffffff"
                                    class="bi bi-grip-horizontal" viewBox="0 0 16 16">
                                    <path
                                        d="M2 8a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm3 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm3 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm3 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm3 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm0-3a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-xl-5">
                    <div class="card border-0" style="border-radius: 8px;">
                        <div class="card-body p-3 p-md-4 p-xl-5">
                            <div class="row">
                                <div class="col-12">
                                    <div class="mb-4">
                                        <h2 class="h3 text-dark-emphasis">កំណត់ពាក្យសម្ងាត់ឡើងវិញ</h2>
                                        <h3 class="fs-6 fw-normal text-dark-emphasis lh-base m-0">
                                            ផ្តល់អាសយដ្ឋានអ៊ីមែលដែលភ្ជាប់ជាមួយគណនីរបស់អ្នក
                                            ដើម្បីសង្គ្រោះពាក្យសម្ងាត់របស់អ្នក។</h3>
                                    </div>
                                </div>
                            </div>
                            <form action="#!">
                                <div class="row gy-3 overflow-hidden">
                                    <div class="col-12">
                                        <div class="form-floating mb-3 position-relative">
                                            <input type="email" class="form-control" id="email"
                                                placeholder="New Password" />
                                            <label for="email">អុីម៉ែល ឬលេខទូរស័ព្ទ</label>
                                        </div>
                                    </div>
                                    <div class="col-12 mb-3">
                                        <button class="btn btn-primary w-100" type="submit">កំណត់ពាក្យសម្ងាត់</button>
                                    </div>
                                    <div class="col-12 text-center">
                                        <a href="login.html" class="text-primary text-decoration-none">
                                             ត្រឡប់ក្រោយ
                                        </a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


</body>

</html>
